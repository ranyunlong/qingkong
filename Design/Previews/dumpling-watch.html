<main>
<header><span class="brand"><i class="brand-mark" aria-hidden="true"></i>小晴空</span><span>心情团子 · 动画预览 01</span></header>
<div class="layout">
<section class="copy">
<p class="eyebrow">A LITTLE FRIEND ON YOUR WRIST</p>
<h1>你的心情，<br>有了小小的回应。</h1>
<p class="intro">轻轻呼吸，偶尔眨眼。<br>开心时笑起来，疲惫时打个哈欠。<br>只做一个，陪着你的团子。</p>
<div class="controls"><span class="control-label" id="mood-label">预览心情</span><div class="moods" role="group" aria-labelledby="mood-label">
<button data-value="1" aria-pressed="false">低落</button><button data-value="2" aria-pressed="false">疲惫</button><button data-value="3" aria-pressed="false">平静</button><button data-value="4" aria-pressed="true">不错</button><button data-value="5" aria-pressed="false">开心</button>
</div><button class="motion" id="motion" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>暂停动画</span></button></div>
<p class="detail" id="detail" aria-live="polite">眨眨眼、笑一笑，抬起小手向你打招呼。试试点一下团子。</p>
</section>
<section class="stage" aria-label="手表动画效果预览">
<div class="hint">切换心情，看看它的变化</div>
<div class="watch"><div class="strap top"></div><div class="strap bottom"></div><div class="crown"></div><div class="side"></div><div class="screen">
<time class="time" aria-label="示例时间九点四十一">09:41</time>
<button class="character" id="character" data-mood="4" aria-label="不错的团子，点按打个招呼"></button>
<div class="mood-copy" id="mood-copy">收集今天的小美好</div>
<div class="metrics" aria-label="示例健康数据">
<div class="metric"><div class="label"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 9h3l2-6 3 10 2-5h4"/></svg>HRV</div><div class="reading">48</div><div class="unit">ms</div></div>
<div class="metric"><div class="label"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13S1.5 9.1 1.5 5.3a3.3 3.3 0 0 1 6.5-.6 3.3 3.3 0 0 1 6.5.6C14.5 9.1 8 13 8 13Z"/></svg>心率</div><div class="reading">68</div><div class="unit">次/分</div></div>
<div class="metric"><div class="label"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c-1.7 2.8-4.5 5.3-4.5 8.1a4.5 4.5 0 0 0 9 0C12.5 6.8 9.7 4.3 8 1.5Z"/></svg>血氧</div><div class="reading">98</div><div class="unit">%</div></div>
</div><div class="sample">健康数值仅为示例</div>
</div></div><span class="caption">时间在上 · 团子在中 · 健康在下</span>
</section>
</div>
<footer><span class="note">这是动画与布局预览，未接入真实心情或健康数据，也未安装为系统表盘。实际表盘呈现形式需结合 watchOS 支持范围确认。</span><span>原有团子素材 · 五种心情</span></footer>

const names=['低落','疲惫','平静','不错','开心'];
const captions=['慢一点，也没关系','休息一下，再出发','此刻，刚刚好','收集今天的小美好','把快乐，抱个满怀'];
const descriptions=['垂下眼睛，轻轻叹口气。低落的时候，也不催你开心。','眼睛慢慢眯起，张嘴打个哈欠，再缓缓合上。','像呼吸一样轻轻起伏，安静地陪着你。','眨眨眼、笑一笑，抬起小手向你打招呼。试试点一下团子。','眯眼笑、嘴巴一张一合，小手开心地挥一挥。'];
const character=document.getElementById('character');
const motion=document.getElementById('motion');
const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)");
let paused=reducedMotion.matches;
let greetingTimeout;
function updatePlayback(){document.body.classList.toggle("paused",paused);document.body.classList.toggle("motion-enabled",!paused);motion.setAttribute("aria-pressed",String(paused));motion.querySelector("span").textContent=paused?"播放动画":"暂停动画"}
updatePlayback();
function selectMood(value){
 clearTimeout(greetingTimeout);
 character.classList.remove("greeting");
 character.dataset.mood=String(value);
 character.innerHTML=drawings[value-1];
 character.setAttribute('aria-label',names[value-1]+'的团子，点按打个招呼');
 document.getElementById('mood-copy').textContent=captions[value-1];
 document.getElementById('detail').textContent=descriptions[value-1];
 document.querySelectorAll('[data-value]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.value)===value)));
}
document.querySelectorAll('[data-value]').forEach(button=>button.addEventListener('click',()=>selectMood(Number(button.dataset.value))));
motion.addEventListener('click',()=>{paused=!paused;updatePlayback()});
reducedMotion.addEventListener('change',event=>{if(event.matches){paused=true;updatePlayback()}});
character.addEventListener('click',()=>{
 if(paused)return;
 clearTimeout(greetingTimeout);
 character.classList.remove('greeting');
 void character.getBoundingClientRect();
 character.classList.add('greeting');
 greetingTimeout=setTimeout(()=>character.classList.remove('greeting'),1200);
});
selectMood(3);
</script>
